site_name: 我的笔记本
site_url: https://griffindorr.github.io/profile/
site_description: 个人技术笔记
site_author: dongjian
copyright: Copyright &copy; 2026 dongjian

repo_name: Griffindorr/profile
repo_url: https://github.com/Griffindorr/profile
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: brown
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: brown
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: zh
  - glightbox
  - git-revision-date-localized:
      type: date
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
extra_css:
  # 网络字体放在最前面，custom.css 放最后，保证我们的覆盖生效
  # 只链 lxgwwenkaiscreen.css：官方的 style.css 会 @import 4 个文件，
  # 其中 gbscreen* 两个与 screen* 定义了同一个 family（同 unicode-range），
  # 按 CSS 规则被后者完全覆盖，属于无效负载，故直接单链生效的那个。
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css
  - https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css
  - https://unpkg.com/katex@0/dist/katex.min.css
  - css/custom.css

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - 首页:
      - index.md
  - 计算机:
      - cs/index.md
      - Rust:
          - 基础语法: cs/rust/basic.md